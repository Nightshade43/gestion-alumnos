# Perfil SOLO para medir carga con datos sintéticos (ver scripts/benchmark/README.md).
# No es para uso diario: apunta a otra base y a otro puerto para no tocar los datos reales.
#
# Se activa sumándolo al perfil local:  SPRING_PROFILES_ACTIVE=local,bench
# El usuario y la clave de la base se heredan de application-local.properties.

spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_alumnos_bench
server.port=8081

# Imprimir cada SQL por consola distorsiona los tiempos (sobre todo en Windows): se apaga.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# En cambio se activan las estadísticas de Hibernate: BenchRequestMetricsFilter (solo con este perfil) las usa
# para registrar en bench.log, por request, cuántas sentencias SQL ejecutó y cuánto tardó en el servidor
# ("BENCH_SQL GET <ruta> sql=<n> ms=<t>"). El script las lee de ahí.
spring.jpa.properties.hibernate.generate_statistics=true
logging.file.name=bench.log
