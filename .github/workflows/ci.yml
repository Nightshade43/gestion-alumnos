# Integración continua: compila y prueba backend y frontend en un entorno limpio.
# Corre en cada push a master (el proyecto es personal y se trabaja directo sobre master) y a mano
# desde la pestaña Actions ("Run workflow"). No despliega nada: todavía no hay a dónde.
name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

# Si llegan dos pushes seguidos, el más viejo se cancela: solo importa el último.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Los tests de repositorio y SecurityIntegrationTest usan una base real, igual que en local.
    # ddl-auto=update crea el esquema sobre esta base vacía; desaparece al terminar el job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestion_alumnos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # En CI no existe application-local.properties (está en .gitignore): la configuración que ahí vive
    # llega por variables de entorno, que Spring Boot mapea solas (SPRING_DATASOURCE_URL -> spring.datasource.url,
    # JWT_SECRET -> jwt.secret, etc.). Los valores son descartables y solo existen dentro de este job.
    # SPRING_PROFILES_ACTIVE pisa el `local` de application.properties.
    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gestion_alumnos
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: secreto-solo-para-ci-de-al-menos-32-caracteres
      ADMIN_USERNAME: admin-ci
      ADMIN_PASSWORD: clave-solo-para-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw se versionó sin permiso de ejecución (se commitea desde Windows).
      - name: Dar permiso de ejecución a mvnw
        run: chmod +x ./mvnw

      - name: Tests
        run: ./mvnw -B --no-transfer-progress test

      # Para ver por qué falló un test sin tener que reproducirlo en local.
      - name: Guardar reportes de tests si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (tipos y build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # `build` ejecuta `tsc -b` (chequeo de tipos) y después `vite build`.
      - name: Tipos y build
        run: npm run build
